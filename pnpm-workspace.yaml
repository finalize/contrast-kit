packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# wrangler が依存する workerd / esbuild はインストール時にビルドスクリプトを走らせる
allowBuilds:
  esbuild: true
  workerd: true

# 公開から24時間経っていないパッケージは選ばない。
# Vite+ はロックファイルの検証でこの基準を使うが、明示しないと解決時には効かず、
# 手元では通って CI で落ちることがある。
minimumReleaseAge: 1440

catalog:
  "@types/node": ^26
  "@vitest/browser-playwright": ^4.1.11
  bumpp: ^12.2.1
  playwright: ^1.63.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.3.0
  wrangler: ^4.129.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

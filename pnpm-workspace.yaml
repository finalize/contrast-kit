packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# 公開から24時間経っていないパッケージは選ばない。
# Vite+ はロックファイルの検証でこの基準を使うが、明示しないと解決時には効かず、
# 手元では通って CI で落ちることがある。
minimumReleaseAge: 1440

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
